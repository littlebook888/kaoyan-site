name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ★ 2026-10-29：连续推送多个提交会撞车。
#   actions/deploy-pages 对同一仓库只允许同时存在一个部署，后到的申请直接 400
#   「in progress deployment」→ 该次 job 报 Failure（v1.103.0 / f365e84 就这么红的）。
#   撞车本身通常不致命（新提交的部署会覆盖），但反向情形——**较旧的抢到锁、
#   较新的报 400**——会让线上静默停在上一个版本，只剩一个容易被忽略的红色 ✗。
#   cancel-in-progress: false = 排队而不是取消，保证每次推送都会被部署一次。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      # 首次尝试失败、重试成功时，page_url 只存在于重试步骤 → 两个都兜住
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ---- 刷题站：安装依赖并构建 ----
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: neike-tiku/pnpm-lock.yaml

      - name: Install dependencies (question bank)
        working-directory: neike-tiku
        run: pnpm install --frozen-lockfile

      - name: Build question bank static site
        working-directory: neike-tiku
        env:
          BASE_PATH: /kaoyan-site/neike-306-tiku/
        run: pnpm run build:pages

      # ---- 组装发布目录：主站(根) + 刷题站(子目录) ----
      - name: Assemble deploy site
        run: |
          set -e
          mkdir -p _site
          # 主站静态文件（相对路径资源，可放任意子路径）
          # ★ 用通配符复制全部 HTML——此前点名复制漏掉了新增的 reminders.html 导致线上 404
          # ★ v1.111.0：robots.txt 必须显式 cp，否则不进 _site（通配符只匹配 *.html）
          cp *.html sw.js manifest.webmanifest robots.txt _site/
          cp -r static _site/
          cp -r assets _site/
          cp -r langqian _site/
          # 刷题站构建产物放入 neike-306-tiku/ 子目录
          mkdir -p _site/neike-306-tiku
          cp -r neike-tiku/dist-pages/* _site/neike-306-tiku/
          # ★ 口诀复习站：单文件自包含 HTML（零构建、零依赖），直接整目录复制
          mkdir -p _site/koujue
          cp koujue/*.html _site/koujue/
          # ★ 必须再产出一个 index.html —— 静态托管访问 /koujue/ 时找的是 index.html，
          #   仓库里只有 koujue.html，于是目录路径 404、只有 /koujue/koujue.html 能开。
          #   主站首页入口（index.html 里 href="koujue/"）正是走目录路径 → 必须修。
          #   cp 而非 mv：保留带文件名的入口，两个地址都能用。
          cp koujue/koujue.html _site/koujue/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # ★ 2026-11-18：GitHub 侧 artifact 元数据 API 抖动会让 deploy-pages 直接报
      #   'No artifacts named "github-pages" were found for this workflow run'，
      #   而同一 run 的 Artifacts 里明明躺着 github-pages（92.9 MB）——
      #   即「文件已传成功，只是查元数据那一下失败」。官方注解原话就是
      #   'Please re-run the deployment at a later time'，属可重试的瞬时故障。
      #   v1.140.0 的 run #362 就这么红的，当时只能推空提交重跑（#363 才过）。
      #   现改成：失败 → 冷 20 秒 → 自动重试一次；两次都挂才算真失败。
      #   ⚠️ 只用 continue-on-error + outcome 判定，不引第三方 retry action。
      - name: Deploy to Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Cool down before retry
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "首次部署失败，20 秒后重试（artifact 元数据传播延迟通常几秒内自愈）"
          sleep 20

      - name: Deploy to Pages (retry once)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # continue-on-error 会把 job 结论抹成 success，必须显式收口，
      # 否则两次全挂也可能显示绿 —— 那正是本项目最忌讳的「静默失败」。
      - name: Fail if both deploy attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: |
          echo "❌ 两次 Pages 部署均失败，请到 Actions 页面查看 deploy 步骤日志"
          exit 1