name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ---- 刷题站：安装依赖并构建 ----
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: neike-tiku/pnpm-lock.yaml

      - name: Install dependencies (question bank)
        working-directory: neike-tiku
        run: pnpm install --frozen-lockfile

      - name: Build question bank static site
        working-directory: neike-tiku
        env:
          BASE_PATH: /kaoyan-site/neike-306-tiku/
        run: pnpm run build:pages

      # ---- 组装发布目录：主站(根) + 刷题站(子目录) ----
      - name: Assemble deploy site
        run: |
          set -e
          mkdir -p _site
          # 主站静态文件（相对路径资源，可放任意子路径）
          # ★ 用通配符复制全部 HTML——此前点名复制漏掉了新增的 reminders.html 导致线上 404
          cp *.html sw.js manifest.webmanifest _site/
          cp -r static _site/
          cp -r assets _site/
          cp -r langqian _site/
          # 刷题站构建产物放入 neike-306-tiku/ 子目录
          mkdir -p _site/neike-306-tiku
          cp -r neike-tiku/dist-pages/* _site/neike-306-tiku/
          # ★ 口诀复习站：单文件自包含 HTML（零构建、零依赖），直接整目录复制
          mkdir -p _site/koujue
          cp koujue/*.html _site/koujue/
          # ★ 必须再产出一个 index.html —— 静态托管访问 /koujue/ 时找的是 index.html，
          #   仓库里只有 koujue.html，于是目录路径 404、只有 /koujue/koujue.html 能开。
          #   主站首页入口（index.html 里 href="koujue/"）正是走目录路径 → 必须修。
          #   cp 而非 mv：保留带文件名的入口，两个地址都能用。
          cp koujue/koujue.html _site/koujue/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4