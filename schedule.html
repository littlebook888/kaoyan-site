<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#66ccff" />
  <meta name="app-version" content="v1.19.1" />
  <title>小本子考研站 · 时间表</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />

  <link rel="stylesheet" href="static/css/theme.css" />
  <script>
    // ★ 版本自检：localStorage 中版本号与当前版本不一致 → 清空所有 SW 缓存 + 刷新
    (function () {
      var CUR = document.querySelector('meta[name="app-version"]').content;
      var LS_KEY = "kaoyan:app_version";
      var stored = null;
      try { stored = localStorage.getItem(LS_KEY); } catch (e) {}
      if (stored !== CUR) {
        try { localStorage.setItem(LS_KEY, CUR); } catch (e) {}
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }).then(function () { location.reload(); });
        } else {
          location.reload();
        }
      }
    })();
  </script>
</head>
<body>
  <div class="bg-ribbon"><span></span><span></span><span></span></div>
  <div id="alert" class="alert"></div>

  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>小本子考研站<small>陈本祯规则部 · 09.13 起执行</small></div>
      </div>
    </div>

    <!-- 理论 vs 实际 对比卡（北京时间联动） -->
    <div class="card sc-compare-card" data-reveal>
      <div class="sc-compare-head">
        <h2><span class="hico" data-icon="clock-3"></span>现在该干什么？</h2>
        <span class="sc-now-time" id="scNowTime">--:--:--</span>
      </div>
      <div class="sc-slot-badge" id="scSlotBadge">加载中…</div>
      <div class="sc-compare" id="scCompare">计算中…</div>
      <div class="hint">理论 = 本表安排 · 实际 = 主站计时状态 · 每 30 秒自动刷新</div>
    </div>

    <!-- 全天时间表 -->
    <div class="card" data-reveal>
      <h2><span class="hico" data-icon="calendar"></span>全天时间安排</h2>
      <div id="scTable"></div>
    </div>

    <!-- 规则速查 -->
    <div class="card" data-reveal>
      <h2><span class="hico" data-icon="book-marked"></span>自习室规则速查</h2>
      <ol class="sc-rules-list" id="scRules"></ol>
    </div>

    <!-- 心态工具 -->
    <div class="card" data-reveal>
      <h2><span class="hico" data-icon="feather"></span>心态工具</h2>
      <div id="scMind"></div>
    </div>

    <div class="hint" style="text-align:center;opacity:.6;margin-top:14px">
      本表为《陈本祯规则部考研时间安排计划表》（2026.09.13 起执行）的线上对照版 · 纸质表以打印件为准
    </div>
  </div>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <a href="index.html"><span class="ic" data-icon="house"></span>首页</a>
    <a href="timer.html"><span class="ic" data-icon="timer"></span>计时</a>
    <a href="tasks.html"><span class="ic" data-icon="list-checks"></span>任务</a>
    <a href="stats.html"><span class="ic" data-icon="chart-no-axes-column"></span>统计</a>
    </nav>

    <script src="static/js/config.js"></script>
  <script src="static/js/blocks.js"></script>
  <script src="static/js/clock.js"></script>
  <script src="static/js/store.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="static/js/icon.js"></script>
  <script src="static/js/reveal.js"></script>
  <script src="static/js/ui.js"></script>
  <script src="static/js/schedule-data.js"></script>
  <script src="static/js/schedule.js"></script>
  <script>
    // ★ Service Worker 注册
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
