<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#66ccff" />
  <meta name="app-version" content="v1.3.1" />
  <title>提醒 · 考研计时</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="static/css/theme.css" />
  <script>
    // ★ 版本自检：localStorage 中版本号与当前版本不一致 → 清空所有 SW 缓存 + 刷新
    (function () {
      var CUR = document.querySelector('meta[name="app-version"]').content;
      var LS_KEY = "kaoyan:app_version";
      var stored = null;
      try { stored = localStorage.getItem(LS_KEY); } catch (e) {}
      if (stored !== CUR) {
        try { localStorage.setItem(LS_KEY, CUR); } catch (e) {}
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }).then(function () { location.reload(); });
        } else {
          location.reload();
        }
      }
    })();
  </script>
</head>
<body>
  <div class="bg-ribbon"><span></span><span></span><span></span></div>
  <div id="alert" class="alert"></div>

  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>提醒栏目<small>状态触发 · 回到正轨</small></div>
      </div>
    </div>

    <!-- 今日时段提示 + 卡片渲染区 -->
    <div id="remindersApp" data-reveal></div>

    <div class="hint" style="text-align:center;opacity:.6;margin-top:14px">
      文案逐字引自浪前课程原文与规则部日志本④ · 仅作自我提醒使用
    </div>
  </div>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <a href="index.html"><span class="ic" data-icon="house"></span>首页</a>
    <a href="timer.html"><span class="ic" data-icon="timer"></span>计时</a>
    <a href="tasks.html"><span class="ic" data-icon="list-checks"></span>任务</a>
    <a href="stats.html"><span class="ic" data-icon="chart-no-axes-column"></span>统计</a>
    </nav>

    <script src="static/js/config.js"></script>
  <script src="static/js/blocks.js"></script>
  <script src="static/js/clock.js"></script>
  <script src="static/js/icon.js"></script>
  <script src="static/js/reveal.js"></script>
  <script src="static/js/ui.js"></script>
  <script src="static/js/reminders-data.js"></script>
  <script src="static/js/reminders.js"></script>
  <script>
    // ★ Service Worker 注册（此前全站从未注册，离线缓存形同虚设——本次修复）
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
