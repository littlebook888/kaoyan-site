  <script>
    // 鈽?鐗堟湰鑷锛歭ocalStorage 涓増鏈彿涓庡綋鍓嶇増鏈笉涓€鑷?鈫?娓呯┖鎵€鏈?SW 缂撳瓨 + 鍒锋柊
    //    淇濊瘉鎵€鏈夎澶囧缁堝姞杞芥渶鏂颁唬鐮侊紙闃叉 Service Worker 鏃х増鏈畫鐣欙級
    (function () {
      var CUR = document.querySelector('meta[name="app-version"]').content;
      var LS_KEY = "kaoyan:app_version";
      var stored = null;
      try { stored = localStorage.getItem(LS_KEY); } catch (e) {}
      if (stored !== CUR) {
        try { localStorage.setItem(LS_KEY, CUR); } catch (e) {}
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }).then(function () { location.reload(); });
        } else {
          location.reload();
        }
      }
    })();
  </script>
